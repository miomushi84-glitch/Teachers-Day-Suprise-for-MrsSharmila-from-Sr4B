<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers' Day Surprise</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4d6,#ffe1ec);color:#333;
}
.card{
  width:min(90%,430px);padding:38px 30px;background:#fff;border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,.15);text-align:center;
}
h1{margin-top:0;font-size:28px}
p{line-height:1.5}
input{
  width:100%;padding:13px 15px;margin:12px 0;border:2px solid #ddd;
  border-radius:12px;font-size:16px;outline:none;
}
input:focus{border-color:#e99ab4}
button{
  width:100%;padding:13px;border:0;border-radius:12px;background:#e99ab4;
  color:#fff;font-size:16px;font-weight:bold;cursor:pointer;
}
button:hover{opacity:.9}
#error{color:#c0395b;min-height:22px;margin-top:10px}
</style>
</head>
<body>
<main class="card">
  <h1>🔐 Teachers' Day Surprise</h1>
  <p>Enter the password to unlock your surprise!</p>
  <input id="password" type="password" placeholder="Password" autocomplete="off">
  <button onclick="unlock()">Unlock ✨</button>
  <div id="error"></div>
</main>

<script>
const PASSWORD = "SH4RM1L4";
const CARD_URL = "https://recocards.com/board/teachers-day-mrs-sharmila-158610061685";

function unlock() {
  const input = document.getElementById("password");
  const error = document.getElementById("error");

  if (input.value === PASSWORD) {
    window.location.assign(CARD_URL);
  } else {
    error.textContent = "Wrong password! Try again 😭";
    input.select();
  }
}

document.getElementById("password").addEventListener("keydown", function(event) {
  if (event.key === "Enter") unlock();
});
</script>
</body>
</html>
