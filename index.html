<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers' Day Surprise</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff4d6, #ffe1ec);
    color: #333;
  }
  .card {
    width: min(90%, 430px);
    padding: 38px 30px;
    background: rgba(255,255,255,.94);
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(0,0,0,.15);
    text-align: center;
  }
  h1 { margin-top: 0; font-size: 28px; }
  p { line-height: 1.5; }
  input {
    width: 100%;
    padding: 13px 15px;
    margin: 12px 0;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #e99ab4; }
  button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    background: #e99ab4;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { opacity: .9; }
  #error {
    color: #c0395b;
    min-height: 22px;
    margin-top: 10px;
  }
  #surprise { display: none; }
</style>
</head>
<body>
  <main class="card">
    <section id="lock">
      <h1>🔐 Teachers' Day Surprise</h1>
      <p>Enter the password to unlock your surprise!</p>
      <input id="password" type="password" placeholder="Password" autocomplete="off">
      <button onclick="unlock()">Unlock ✨</button>
      <div id="error"></div>
    </section>

    <section id="surprise">
      <h1>🎉 Happy Teachers' Day, Mrs. Sharmila! 💐</h1>
      <p>You've unlocked your surprise! We hope you know how much we appreciate everything you do for us. ❤️</p>
      <p>Thank you for making maths a little less scary and a lot more memorable!</p>
    </section>
  </main>

<script>
function unlock() {
  const entered = document.getElementById("password").value;
  const error = document.getElementById("error");

  if (entered === "SH4RM1L4") {
    document.getElementById("lock").style.display = "none";
    document.getElementById("surprise").style.display = "block";
  } else {
    error.textContent = "Wrong password! Try again 😭";
  }
}

document.getElementById("password").addEventListener("keydown", function(event) {
  if (event.key === "Enter") unlock();
});
</script>
</body>
</html>
